# YOLOv8-Ghost-P2-SPPF: P2–P4 outputs only, SPPF on P4

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]             # 0 - P1/2
  - [-1, 1, GhostConv, [128, 3, 2]]       # 1 - P2/4
  - [-1, 3, C3Ghost, [128, True]]         # 2
  - [-1, 1, GhostConv, [256, 3, 2]]       # 3 - P3/8
  - [-1, 6, C3Ghost, [256, True]]         # 4
  - [-1, 1, GhostConv, [512, 3, 2]]       # 5 - P4/16
  - [-1, 6, C3Ghost, [512, True]]         # 6
  - [-1, 1, SPPF, [512, 5]]               # 7 - SPPF on P4

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 8
  - [[-1, 4], 1, Concat, [1]]                    # 9 - cat backbone P3
  - [-1, 3, C3Ghost, [256]]                      # 10

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 2], 1, Concat, [1]]                    # 12 - cat backbone P2
  - [-1, 3, C3Ghost, [128]]                      # 13 (P2/4)

  - [-1, 1, GhostConv, [128, 3, 2]]              # 14
  - [[-1, 10], 1, Concat, [1]]                   # 15 - P3
  - [-1, 3, C3Ghost, [256]]                      # 16 (P3/8)

  - [-1, 1, GhostConv, [256, 3, 2]]              # 17
  - [[-1, 7], 1, Concat, [1]]                    # 18 - P4 (SPPF output)
  - [-1, 3, C3Ghost, [512]]                      # 19 (P4/16)

  - [[13, 16, 19], 1, Detect, [nc]]             # 20 - Detect(P2, P3, P4)
