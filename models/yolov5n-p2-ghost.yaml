# Parameters
nc: 80  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.25  # layer channel multiple
anchors: 3  # AutoAnchor evolves 3 anchors per P output layer

# Backbone
backbone:
  [
    [-1, 1, Conv, [64, 6, 2, 2]],          # 0 - P1/2
    [-1, 1, GhostConv, [128, 3, 2]],       # 1 - P2/4
    [-1, 3, C3Ghost, [128]],               # 2
    [-1, 1, GhostConv, [256, 3, 2]],       # 3 - P3/8
    [-1, 6, C3Ghost, [256]],               # 4
    [-1, 1, GhostConv, [512, 3, 2]],       # 5 - P4/16
    [-1, 9, C3Ghost, [512]],               # 6
    [-1, 1, SPPF, [512, 5]],               # 7 - SPPF applied to P4
  ]

# Head
head: [
    [-1, 1, GhostConv, [256, 1, 1]],                   # 8
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],        # 9
    [[-1, 4], 1, Concat, [1]],                         # 10 - P4 + P3
    [-1, 3, C3Ghost, [256, False]],                    # 11

    [-1, 1, GhostConv, [128, 1, 1]],                   # 12
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],        # 13
    [[-1, 2], 1, Concat, [1]],                         # 14 - P3 + P2
    [-1, 3, C3Ghost, [128, False]],                    # 15 (P2/4)

    [-1, 1, GhostConv, [128, 3, 2]],                   # 16
    [[-1, 11], 1, Concat, [1]],                        # 17 - upsampled P2 + P3
    [-1, 3, C3Ghost, [256, False]],                    # 18 (P3/8)

    [-1, 1, GhostConv, [256, 3, 2]],                   # 19
    [[-1, 7], 1, Concat, [1]],                         # 20 - upsampled P3 + P4 (SPPF output)
    [-1, 3, C3Ghost, [512, False]],                    # 21 (P4/16)

    [[15, 18, 21], 1, Detect, [nc, anchors]]           # 22 - Detect(P2, P3, P4)
  ]
