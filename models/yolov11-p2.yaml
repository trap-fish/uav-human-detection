# YOLO11-P2SPPF: Lightweight model with P2–P4 outputs and SPPF on P4 (no P5)

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]        # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]        # 5 - P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5]]           # 7 - SPPF on P4
  - [-1, 2, C2PSA, [512]]             # 8 - Feature aggregation

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]         # cat with P3
  - [-1, 2, C3k2, [256, False]]       # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]         # cat with P2
  - [-1, 2, C3k2, [128, False]]       # 14 (P2/4)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]        # cat with P3
  - [-1, 2, C3k2, [256, False]]       # 17 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]         # cat with P4 (C2PSA)
  - [-1, 2, C3k2, [512, False]]       # 20 (P4/16)

  - [[14, 17, 20], 1, Detect, [nc]]   # Detect(P2, P3, P4)
